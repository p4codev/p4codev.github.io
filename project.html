<script>
	$(function () {
		$('.menu-icon').on('click', function () {
			$('header.left').toggleClass('open');
			$('.mobile-header, main.content').toggleClass('push');
		});
		$('main.content, header.left button.close').on('click', function () {
			$('header.left').removeClass('open');
			$('.mobile-header, main.content').removeClass('push');
		});
		$('.spacer').each(function () { this.style.height = this.getAttribute('data-height') + 'px'; });
		$(window).on('scroll', function () {
			if ($(this).scrollTop() >= 250) { $('#return-to-top').fadeIn(200); } else { $('#return-to-top').fadeOut(200); }
		});
		$('#return-to-top').on('click', function () { $('body,html').animate({ scrollTop: 0 }, 400); });
	});
</script>
